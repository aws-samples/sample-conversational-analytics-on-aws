[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sample-conversational-analytics-on-aws"
version = "0.1.0"
description = "A demonstration data platform for conversational analytics with Amazon Quick"
license = "MIT-0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-lib==2.272.0",
    "boto3==1.42.36",
    "cdk-nag==2.38.2",
    "constructs==10.8.1",
    "faker==40.1.2",
    "pandas==3.0.0",
    "pyarrow==24.0.0",
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
    "ruff==0.14.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/conversational_analytics"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]  # errors, pyflakes, isort, pyupgrade
ignore = ["E501"]  # let formatter handle line length

[tool.ruff.lint.per-file-ignores]
# CDK entry point puts src/ on sys.path before importing the stacks
"cdk/app.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
